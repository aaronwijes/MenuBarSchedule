name: Build macOS App

on:
  push:
    branches: [ main ]
    tags:
      - "*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS App
    runs-on: macos-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15.0-rc.3'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build macOS App Bundle
      run: |
        pyinstaller ./resources/MenuBarSchedule.spec
        ditto -c -k --sequesterRsrc --keepParent dist/MenuBarSchedule.app dist/MenuBarSchedule.app.zip

    - name: Upload Built App Package
      uses: actions/upload-artifact@v7
      with:
        name: MenuBarSchedule.app.zip
        path: dist/MenuBarSchedule.app.zip

    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: |
          dist/MenuBarSchedule.app/
          dist/schedules.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
