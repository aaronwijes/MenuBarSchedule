name: Build

on:
  push:
    branches: [ main ]
    tags:
      - "*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements_mac.txt ]; then pip install -r requirements_mac.txt; fi

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements_win.txt ]; then pip install -r requirements_win.txt; fi

      - name: Build App (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller ./resources/macos.spec
          ditto -c -k --sequesterRsrc --keepParent dist/MenuBarSchedule.app dist/MenuBarSchedule.app.zip

      - name: Build App (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller ./resources/win.spec
          mkdir ./dist/MenuBarSchedule/resources/
          copy ./resources/Gidole-Regular.ttf ./dist/MenuBarSchedule/resources/Gidole-Regular.ttf
          copy ./resources/FONT_LICENSE ./dist/MenuBarSchedule/resources/FONT_LICENSE
          powershell -Command "Compress-Archive -Path ./dist/MenuBarSchedule/ -DestinationPath ./dist/MenuBarSchedule.zip"

      - name: Upload app package (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: MenuBarSchedule.app.zip
          path: dist/MenuBarSchedule.app.zip

      - name: Upload app package (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: MenuBarSchedule.zip
          path: dist/MenuBarSchedule.zip

  upload-schedules:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Build schedules
        run: |
          zip -q -r dist/schedules.zip ./schedules/*

      - name: Upload schedules
        uses: actions/upload-artifact@v7
        with:
          name: schedules.zip
          path: dist/schedules.zip
    
      - name: Upload schedule metadata
        uses: actions/upload-artifact@v7
        with:
          name: metadata.json
          path: schedules/metadata.json

  release:
    runs-on: ubuntu-latest
    needs: [build, upload-schedules]
    
    permissions:
      contents: write

    steps:
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/MenuBarSchedule.app.zip
            dist/schedules.zip
            schedules/metadata.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
